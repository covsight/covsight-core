package:
  name: covsight-core

  dep-sets:
  - name: default-dev
    deps:
    - name: minizip-ng
      url: https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.2.1.tar.gz
    - name: cjson
      url: https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.19.tar.gz
    - name: sphinx-js
      src: pypi
      version: ">=5.0.3"
    # Hawkmoth extracts the C++ reference straight from the writer's headers
    # into Sphinx's cpp domain -- no Doxygen and no XML intermediate. It parses
    # with libclang, and the libclang wheel bundles its own shared library, so
    # no system package is needed; hawkmoth_compiler in docs/source/conf.py
    # asks the local g++ where the standard headers live.
    - name: hawkmoth
      src: pypi
      version: ">=0.22.0"
    - name: libclang
      src: pypi
      version: ">=18.1.1"
    # Test-side dependencies live here rather than in ad-hoc `pip install`
    # lines in CI, so there is one declared list. The C and C++ jobs run their
    # XSD-validation suites out of the ivpm venv (packages/python), which is
    # the same interpreter a developer gets from `ivpm update` locally.
    - name: pytest
      src: pypi
    - name: xmlschema
      src: pypi
    - name: node
      src: package.json
      path: ts/package.json


