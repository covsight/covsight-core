# Docs build for covsight/covsight-core on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. .github/workflows/ci.yml
# builds them too, as a CI check, but its Pages deploy was deleted -- see
# ~/Documents/dvkit-docs-publishing-design.md 5.9. dvkit.org owns all
# documentation: <org>.github.io lands at dvkit.org/<org>/, and a repo's docs
# land at dvkit.org/<org>/<repo>/. dvkit.org is a single Cloudflare Pages
# project and a deploy replaces the WHOLE site, so there is exactly one
# publisher for it.
#
# What happens after this job, all of it host-side:
#
#   docs-fetch covsight/covsight-core main   # artifact -> staging/
#   (review over the tailnet on :8443)
#   docs-promote / docs-deploy               # -> dvkit.org/covsight/covsight-core/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing: a workflow file is public and editable by
# anyone who can push, and the deploy credential is account-scoped.
#
# Four constraints this file is shaped by:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so actions/setup-python
#     and actions/setup-node do not exist here. The runner's `ubuntu-latest`
#     maps to catthehacker/ubuntu:act-22.04, which already carries Python 3.10
#     and Node 24 -- both sufficient (pyproject requires >=3.10).
#  2. `pip` in that image is 22.0.2 and predates PEP 660, so it cannot do an
#     editable install of a pyproject-only project ("build backend is missing
#     the build_editable hook"). Hence the pip upgrade below. Nothing here needs
#     an editable install anyway -- conf.py puts ../python on sys.path itself.
#  3. NO release-authority gate. That switch decides who publishes PACKAGES to
#     PyPI/npm/Marketplace. Docs are not a release: they publish from Forgejo to
#     dvkit.org unconditionally, whichever side holds release authority. Adding
#     the gate here would silently stop docs whenever the switch said "github".
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the tag; a depth-1 checkout without tags makes
          # every build look like an untagged dev version.
          fetch-depth: 0

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files -- if a
        # build ever needs one, it belongs in a repository secret, which is
        # masked in logs.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/docs.yml' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install TypeScript dependencies
        # sphinx-js drives typedoc out of ts/node_modules; conf.py points
        # SPHINX_JS_NODE_MODULES at it. Without this the TypeScript half of the
        # reference silently renders empty.
        run: cd ts && npm ci

      - name: Install doc dependencies
        run: |
          python3 -m pip install -q --upgrade pip setuptools wheel
          python3 -m pip install -q -r docs/requirements.txt

      - name: Patch sphinx-js BigInt bug
        # Same patch the GitHub workflow applies. `python`, unqualified, does
        # not exist in this image -- only `python3`.
        run: |
          SPHINX_JS_PATH=$(python3 -c "import sphinx_js, os; print(os.path.dirname(sphinx_js.__file__))")
          patch "$SPHINX_JS_PATH/js/convertType.ts" docs/patches/sphinx-js-bigint.patch

      - name: Build HTML docs
        run: cd docs && make html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys. These checks
        # are what distinguish "built" from "built something real".
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find docs/_build/html -name '*.html' | wc -l)
          echo "generated pages: $n"
          [ "$n" -ge 20 ] || { echo "::error::only $n pages built; expected ~25. Refusing to call this a doc set."; exit 1; }
          # The TypeScript reference is the part that fails silently when
          # node_modules or the sphinx-js patch did not land, so check it by
          # content rather than trusting the exit status above.
          test -s docs/_build/html/reference/typescript-api/index.html \
            || { echo "::error::no TypeScript API reference -- sphinx-js did not run"; exit 1; }

      - name: Upload docs
        # Consumed by the host-side poller: `docs-fetch covsight/covsight-core main`.
        # Note the explicit branch -- docs-fetch defaults to `master` and this
        # repo's default branch is `main`.
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-covsight-covsight-core
          path: docs/_build/html/**
          if-no-files-found: error
