name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,validate]"
      - name: Test
        run: pytest

  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: cd ts && npm ci
      - name: Lint
        run: cd ts && npm run lint
      - name: Build
        run: cd ts && npm run build
      - name: Test
        run: cd ts && npm test

  c:
    name: C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch C dependencies
        run: pip install ivpm && ivpm update
      - name: Build
        run: cmake -S c -B c/build && cmake --build c/build
      - name: Test
        run: ctest --test-dir c/build --output-on-failure

  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install TypeScript dependencies
        run: cd ts && npm ci
      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt
      - name: Patch sphinx-js BigInt bug
        run: |
          SPHINX_JS_PATH=$(python -c "import sphinx_js, os; print(os.path.dirname(sphinx_js.__file__))")
          patch "$SPHINX_JS_PATH/js/convertType.ts" docs/patches/sphinx-js-bigint.patch
      - name: Build docs
        run: cd docs && make html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
