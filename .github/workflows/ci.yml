name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: cd ts && npm ci
      - name: Lint
        run: cd ts && npm run lint
      - name: Build
        run: cd ts && npm run build
      - name: Test
        run: cd ts && npm test

  c:
    name: C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch C dependencies
        run: |
          mkdir -p packages
          curl -L https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.2.1.tar.gz \
            | tar -xz -C packages --one-top-level=minizip-ng --strip-components=1
          curl -L https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.19.tar.gz \
            | tar -xz -C packages --one-top-level=cjson --strip-components=1
      - name: Build
        run: cmake -S c -B c/build && cmake --build c/build
      - name: Test
        run: ctest --test-dir c/build --output-on-failure
