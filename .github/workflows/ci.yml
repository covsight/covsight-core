name: CI

on:
  push:
    branches: [main, master]   # build only -- docs-deploy is gated below
    tags: ['v*']               # build + docs-deploy
  pull_request:
    branches: [main, master]
  workflow_dispatch:           # build + docs-deploy, on demand

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,validate]"
      - name: Test
        run: pytest

  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: cd ts && npm ci
      - name: Lint
        run: cd ts && npm run lint
      - name: Build
        run: cd ts && npm run build
      - name: Test
        run: cd ts && npm test

  c:
    name: C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch C dependencies
        run: pip install ivpm && ivpm update
      - name: Build
        run: cmake -S c -B c/build && cmake --build c/build
      - name: Test
        run: ctest --test-dir c/build --output-on-failure

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install TypeScript dependencies
        run: cd ts && npm ci
      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt
      - name: Patch sphinx-js BigInt bug
        run: |
          SPHINX_JS_PATH=$(python -c "import sphinx_js, os; print(os.path.dirname(sphinx_js.__file__))")
          patch "$SPHINX_JS_PATH/js/convertType.ts" docs/patches/sphinx-js-bigint.patch
      - name: Build docs
        run: cd docs && make html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      # Plain artifact alongside the Pages one, named to the <org>-<repo>
      # convention the host-side dvkit.org docs poller consumes.
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-covsight-covsight-core
          path: docs/_build/html
          if-no-files-found: error

  docs-deploy:
    # Publication is TAG-DRIVEN, not branch-driven.
    #
    # Forgejo is the origin of truth and mirrors main to GitHub automatically
    # (sync-policy.toml [org.covsight]). Deploying on a branch push would
    # republish these docs as a side effect of a sync enabled for unrelated
    # reasons -- and would do it from whatever content happened to be mirrored,
    # reviewed or not. A `v*` tag is the deliberate act.
    #
    # The docs job above still builds on every push and PR, so a broken docs
    # build is caught immediately. Only the publish is gated.
    name: Publish docs
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
