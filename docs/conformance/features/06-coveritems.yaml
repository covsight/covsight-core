# UCIS conformance registry -- section 6: Coveritems
#
# GENERATED SKELETON, HAND-MAINTAINED THEREAFTER.
# Records intent only: what the backend is expected to do with each feature.
# Status ("is it tested?", "is it documented?") is computed by
# tools/gen_conformance_matrix.py and never written here.
#
# See docs/conformance/README.md.

section:
  number: 6
  title: "Coveritems"
  spec_ref: "§ 8.11"

features:
  - id: C6.1
    title: "`ucis_CreateNextCover(db, parent, name, data, srcinfo)` → cover index"
    spec_ref: "§ 8.11.1"
    kind: feature
    backends:
      parquet:
        scope: core

  - id: C6.2
    title: "`ucis_RemoveCover(db, parent, coverindex)`"
    spec_ref: "§ 8.11.2"
    kind: feature
    backends:
      parquet:
        scope: deferred
        reason: >
          In-place removal from an append-only columnar dataset. The write path
          is a batch loader and has no delete; removal would be expressed as
          rewriting the definition tables, which is a separate feature from the
          UCIS call.
        adr: docs/adr/0003-parquet-backend.md

  - id: C6.3
    title: "`ucis_GetCoverData(db, parent, coverindex, &name, &data, &srcinfo)`"
    spec_ref: "§ 8.11.3"
    kind: feature
    backends:
      parquet:
        scope: core

  - id: C6.4
    title: "`ucis_SetCoverData(db, parent, coverindex, data)`"
    spec_ref: "§ 8.11.4"
    kind: feature
    backends:
      parquet:
        scope: core

  - id: C6.5
    title: "`ucis_IncrementCover(db, parent, coverindex, delta)` — incremental update"
    spec_ref: "§ 8.11.5"
    kind: feature
    backends:
      parquet:
        scope: deferred
        reason: >
          Additive update is expressed as an appended run plus GROUP BY SUM, not
          as in-place increment. Whether the backend should emulate the call
          over that model is undecided.
        adr: docs/adr/0003-parquet-backend.md

  - id: C6.6
    title: "`ucis_GetCoverFlag` / `ucis_SetCoverFlag` / `ucis_GetCoverFlags`"
    spec_ref: "§ 8.11.6–8"
    kind: feature
    backends:
      parquet:
        scope: core

  - id: BT.1
    title: "`UCIS_CVGBIN`"
    kind: feature
    backends:
      parquet:
        scope: core
    notes: >
      Covergroup coverpoint/cross bin (§ 6.4.2) coveritems.cover_type carries
      the bin type; the merge operator is keyed on it, which is why every
      value has to survive exactly (see X.5 for PEAKACTIVEBIN).

