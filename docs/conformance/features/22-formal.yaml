section:
  number: 22
  title: "Formal verification"
  spec_ref: "§ 8.19"

features:
  - id: FM.1
    title: "Formal-status enum + `ucis_SetFormalStatus` / `ucis_GetFormalStatus`"
    spec_ref: "§ 8.19.3–5"
    kind: feature
    backends:
      parquet:
        scope: extended
        reason: >
          Formal verification results. A simulation-only tool produces none, and
          a reader that cannot interpret them still reads every count correctly,
          so requiring them would exclude conforming implementations for no
          interoperability gain.
    notes: >
      The formal table carries status, radius and witness per assertion bin,
      run-scoped because a proof status comes from a run. Merging is
      precedence, not sum -- see X.4.

