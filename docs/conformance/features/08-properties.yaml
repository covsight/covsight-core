# UCIS conformance registry -- section 8: Properties
#
# HAND-AUTHORED (T21). Records intent only: what the backend is expected to do
# with each feature. Status ("is it tested?", "is it documented?") is computed
# by tools/gen_conformance_matrix.py and never written here.
#
# See docs/conformance/README.md.

section:
  number: 8
  title: "Properties"
  spec_ref: "§ 8.3"
  notes: >
    The typed-property vocabulary: the prop_id key space of the properties
    table plus the get/set surface that reaches it. Entries whose token UCIS
    1.0 does not define are out_of_scope with the reason recorded, as in
    section 6 (BT.5) and section 4 (ST.24, ST.37, ST.38).

features:

  - id: PI.1
    title: "`UCIS_INT_IS_MODIFIED` — modified since the stored UCISDB was opened (read-only)"
    spec_ref: "§ 8.3.1"
    kind: feature
    backends:
      parquet:
        scope: out_of_scope
        reason: >
          UCIS 1.0 s 8.3 states this property is in-memory only and is not
          stored in the database, so no persistent representation can exist.
    notes: >
      Applies to: db. Where it lives: not stored.

